<section class="flex min-h-[80vh] items-center justify-center">
  <div class="card w-full max-w-sm border border-base-300 bg-base-100 shadow-sm">
    <div class="card-body gap-4">

      <h2 class="text-2xl font-black tracking-tight">
        @if (isLogin()) { Iniciar sesion } @else { Crear cuenta }
      </h2>

      <form [formGroup]="authForm" (ngSubmit)="onSubmit()" class="space-y-4">

        <div class="form-control">
          <label class="label" for="email">
            <span class="label-text">Correo electronico</span>
          </label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="usuario@ejemplo.com"
            class="input input-bordered w-full"
            [class.input-error]="authForm.get('email')?.invalid && authForm.get('email')?.touched"
          />
        </div>

        <div class="form-control">
          <label class="label" for="password">
            <span class="label-text">Contrasena</span>
          </label>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="••••••"
            class="input input-bordered w-full"
            [class.input-error]="authForm.get('password')?.invalid && authForm.get('password')?.touched"
          />
        </div>

        @if (errorMessage()) {
          <div class="alert alert-error py-2 text-sm">
            <span>{{ errorMessage() }}</span>
          </div>
        }

        <button
          type="submit"
          class="btn btn-primary w-full"
          [disabled]="authForm.invalid || isLoading()"
        >
          @if (isLoading()) {
            <span class="loading loading-spinner loading-sm"></span>
          } @else if (isLogin()) {
            Ingresar
          } @else {
            Registrarse
          }
        </button>
      </form>

      <!-- Separador -->
      <div class="divider text-base-content/40">O</div>

      <!-- Boton de Google -->
      <button
        type="button"
        class="btn btn-outline w-full gap-2"
        (click)="loginWithGoogle()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="h-5 w-5">
          <path fill="#EA4335" d="M24 9.5c3.1 0 5.6 1.1 7.6 2.9l5.6-5.6C33.5 3.5 29.1 1.5 24 1.5 14.9 1.5 7.2 7.1 4 15l6.6 5.1C12.3 13.6 17.6 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.4 5.7c4.3-4 6.8-9.9 6.8-16.9z"/>
          <path fill="#FBBC05" d="M10.6 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6L3.7 14.3A22.5 22.5 0 0 0 1.5 24c0 3.6.9 7 2.4 10l6.7-5.4z"/>
          <path fill="#34A853" d="M24 46.5c5.1 0 9.4-1.7 12.5-4.6l-7.4-5.7c-1.7 1.1-3.9 1.8-6.3 1.8-6.3 0-11.6-4.3-13.5-10l-6.6 5.1C7.2 40.9 14.9 46.5 24 46.5z"/>
        </svg>
        Continuar con Google
      </button>

      <!-- Toggle login/registro -->
      <p class="text-center text-sm text-base-content/60">
        @if (isLogin()) {
          ¿No tienes cuenta?
          <button class="link link-primary" (click)="toggleMode()">Registrate aqui</button>
        } @else {
          ¿Ya tienes cuenta?
          <button class="link link-primary" (click)="toggleMode()">Inicia sesion</button>
        }
      </p>

    </div>
  </div>
</section>
